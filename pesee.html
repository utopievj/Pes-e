<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesée</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrap">
  <div class="card">

    <h1>Pesée</h1>

    <div id="status">Prêt.</div>

    <div class="grid">
      <div class="col-4">
        <label>Ville</label>
        <select id="ville">
          <option>Assat</option>
          <option>Toulouse</option>
          <option>Pau</option>
        </select>
      </div>

      <div class="col-4">
        <label>Type</label>
        <select id="type">
          <option value="PAM">PAM</option>
          <option value="ASL">ASL</option>
          <option value="ABJ">ABJ</option>
          <option value="F">Frigo</option>
          <option value="HF">Hors froid</option>
        </select>
      </div>

      <div class="col-2">
        <label>Nb bacs</label>
        <input id="nb" type="number" min="1" step="1" value="1">
      </div>

      <div class="col-2">
        <label>Poids brut (kg)</label>
        <input id="brut" type="number" step="0.1" inputmode="decimal">
      </div>

      <div class="col-12">
        <div class="big">
          Net : <span id="net">0</span> kg
        </div>
      </div>

      <div class="col-12">
        <button onclick="enregistrer()">ENREGISTRER</button>
      </div>
    </div>

    <hr>

    <h2>Historique local</h2>

    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Ville</th>
            <th>Type</th>
            <th class="right">Nb</th>
            <th class="right">Net</th>
          </tr>
        </thead>
        <tbody id="historique"></tbody>
      </table>
    </div>

  </div>
</div>

<script>
/* ===== CONFIG ===== */
const TARE = {
  PAM: 59,
  ASL: 45,
  ABJ: 43,
  F: 0,
  HF: 0
};

/* ===== CALCUL ===== */
function calc() {
  const type = document.getElementById("type").value;
  const nb = Math.max(1, parseInt(document.getElementById("nb").value || 1));
  document.getElementById("nb").value = nb;

  const brut = Number(document.getElementById("brut").value || 0);
  const tare = (TARE[type] || 0) * nb;
  const net = Math.max(0, brut - tare);

  document.getElementById("net").textContent = net.toFixed(1);
}

["type","nb","brut"].forEach(id=>{
  document.getElementById(id).addEventListener("input", calc);
});

/* ===== HISTORIQUE LOCAL ===== */
function chargerHistorique() {
  const data = JSON.parse(localStorage.getItem("pesees") || "[]");
  const tbody = document.getElementById("historique");
  tbody.innerHTML = "";

  data.forEach(l=>{
    tbody.innerHTML += `
      <tr>
        <td>${new Date(l.date).toLocaleString()}</td>
        <td>${l.ville}</td>
        <td>${l.type}</td>
        <td class="right">${l.nb}</td>
        <td class="right">${l.net}</td>
      </tr>
    `;
  });
}

function enregistrer() {
  calc();

  const ville = document.getElementById("ville").value;
  const type = document.getElementById("type").value;
  const nb = Number(document.getElementById("nb").value);
  const brut = Number(document.getElementById("brut").value);
  const net = Number(document.getElementById("net").textContent);

  if (!brut) {
    alert("Entre un poids brut");
    return;
  }

  const data = JSON.parse(localStorage.getItem("pesees") || "[]");

  data.unshift({
    date: Date.now(),
    ville,
    type,
    nb,
    net
  });

  localStorage.setItem("pesees", JSON.stringify(data));

  document.getElementById("brut").value = "";
  calc();
  chargerHistorique();
}

/* INIT */
calc();
chargerHistorique();
</script>

</body>
</html>
