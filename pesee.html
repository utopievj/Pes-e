<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesée</title>

  <!-- CSS EXTERNE -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ===== PAGE PESÉE ===== -->
<div class="card" id="pagePesee">
  <h2>Pesée</h2>

  <label>Ville</label>
  <input id="ville" type="text" placeholder="Ex: Toulouse">

  <label>Type</label>
  <select id="type">
    <option value="PAM">PAM (59 kg)</option>
    <option value="ECRAN">Écran (59 kg)</option>
    <option value="ASL">ASL (45 kg)</option>
    <option value="ABJ">ABJ (43 kg)</option>
  </select>

  <label>Nombre de bacs (1 à 4)</label>
  <select id="nb">
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
  </select>

  <label>Poids brut (kg)</label>
  <input id="brut" type="number" step="0.1" placeholder="Ex: 120.5">

  <h3>Net : <span id="net">0</span> kg</h3>

  <button onclick="enregistrer()">ENREGISTRER</button>

  <button class="secondary" onclick="goHistorique()">Voir l’historique</button>

  <div id="msg"></div>
</div>

<!-- ===== PAGE HISTORIQUE ===== -->
<div class="card hidden" id="pageHistorique">
  <h2>Historique</h2>

  <div id="liste"></div>

  <button class="secondary" onclick="goPesee()">Retour</button>
</div>

<script>
/* ===== TARES ===== */
const TARES = {
  PAM: 59,
  ECRAN: 59,
  ASL: 45,
  ABJ: 43
};

const $ = id => document.getElementById(id);

/* ===== CALCUL ===== */
function calcul(){
  const type = $("type").value;
  const nb = Number($("nb").value);
  const brut = Number($("brut").value || 0);
  const tare = (TARES[type] || 0) * nb;
  const net = Math.max(0, brut - tare);
  $("net").textContent = net.toFixed(1);
}

$("type").addEventListener("change", calcul);
$("nb").addEventListener("change", calcul);
$("brut").addEventListener("input", calcul);

/* ===== ENREGISTRER (LOCAL STORAGE) ===== */
function enregistrer(){
  const ville = $("ville").value.trim();
  const type = $("type").value;
  const nb = Number($("nb").value);
  const brut = Number($("brut").value || 0);

  if(!ville){
    $("msg").textContent = "❌ Ville obligatoire";
    return;
  }
  if(brut <= 0){
    $("msg").textContent = "❌ Poids brut invalide";
    return;
  }

  const tare = TARES[type] * nb;
  const net = brut - tare;

  const data = {
    date: new Date().toLocaleString(),
    ville,
    type,
    nb,
    brut,
    net: net.toFixed(1)
  };

  const hist = JSON.parse(localStorage.getItem("historique") || "[]");
  hist.unshift(data);
  localStorage.setItem("historique", JSON.stringify(hist));

  $("msg").textContent = "✅ Enregistré";
  $("brut").value = "";
  calcul();
}

/* ===== HISTORIQUE ===== */
function goHistorique(){
  $("pagePesee").classList.add("hidden");
  $("pageHistorique").classList.remove("hidden");
  renderHistorique();
}

function goPesee(){
  $("pageHistorique").classList.add("hidden");
  $("pagePesee").classList.remove("hidden");
}

function renderHistorique(){
  const hist = JSON.parse(localStorage.getItem("historique") || "[]");
  const div = $("liste");

  if(!hist.length){
    div.innerHTML = "<p>Aucune donnée</p>";
    return;
  }

  div.innerHTML = hist.map(h => `
    <p>
      <b>${h.date}</b><br>
      ${h.ville} – ${h.type} – ${h.nb} bacs<br>
      Brut: ${h.brut} kg | Net: <b>${h.net} kg</b>
    </p>
    <hr>
  `).join("");
}
</script>

</body>
</html>
