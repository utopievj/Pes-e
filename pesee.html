<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pesée</title>

  <!-- CSS séparé -->
  <link rel="stylesheet" href="style.css">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="center">
  <div class="card max420">
    <h2>Connexion</h2>

    <label>Email</label>
    <input id="email" type="email">

    <label>Mot de passe</label>
    <input id="password" type="password">

    <button id="btnLogin">SE CONNECTER</button>

    <div id="loginMsg" class="err"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="wrap">
    <div class="card">

      <!-- NAV -->
      <div class="row">
        <button id="btnShowPesee">➕ Pesée</button>
        <button id="btnShowHist">📜 Historique</button>
        <button class="danger" id="btnLogout">🚪 Déconnexion</button>
        <span class="badge" id="userBadge"></span>
      </div>

      <div id="status"></div>

      <!-- PAGE PESEE -->
      <div id="pagePesee">
        <h2>Pesée</h2>

        <div class="grid">
          <div class="col-4">
            <label>Ville</label>
            <input id="ville">
          </div>

          <div class="col-4">
            <label>Type</label>
            <select id="type">
              <option value="PAM">PAM (59 kg)</option>
              <option value="ECRAN">Écran (59 kg)</option>
              <option value="ASL">ASL (45 kg)</option>
              <option value="ABJ">ABJ (43 kg)</option>
            </select>
          </div>

          <div class="col-2">
            <label>Nb bacs (1–4)</label>
            <input id="nb" type="number" min="1" max="4" value="1">
          </div>

          <div class="col-2">
            <label>Brut (kg)</label>
            <input id="brut" type="number" step="0.1">
          </div>

          <div class="col-12">
            <div class="big">Net : <span id="net">0</span> kg</div>
          </div>

          <div class="col-12">
            <button id="btnSave">ENREGISTRER</button>
          </div>
        </div>
      </div>

      <!-- PAGE HISTORIQUE -->
      <div id="pageHist" style="display:none">
        <h2>Historique</h2>

        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Ville</th>
                <th>Type</th>
                <th class="right">Nb</th>
                <th class="right">Net (kg)</th>
              </tr>
            </thead>
            <tbody id="hist"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
/* =========================
   CONFIG SUPABASE
========================= */
const SUPABASE_URL = "https://dzfokswsmkvhjhziqakj.supabase.co";
const SUPABASE_KEY = "REMPLACE_TA_CLE_ANON_ICI";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

/* =========================
   CONSTANTES
========================= */
const TARE = {
  PAM: 59,
  ECRAN: 59,
  ASL: 45,
  ABJ: 43
};

const $ = id => document.getElementById(id);

/* =========================
   CALCUL NET
========================= */
function calc() {
  let nb = Math.min(4, Math.max(1, parseInt($("nb").value || 1)));
  $("nb").value = nb;

  let brut = parseFloat($("brut").value || 0);
  let type = $("type").value;

  let net = Math.max(0, brut - (TARE[type] * nb));
  $("net").textContent = net.toFixed(1);

  return net;
}

$("nb").oninput =
$("brut").oninput =
$("type").onchange = calc;

/* =========================
   LOGIN
========================= */
$("btnLogin").onclick = async () => {
  $("loginMsg").textContent = "";

  const { data, error } = await supabase.auth.signInWithPassword({
    email: $("email").value,
    password: $("password").value
  });

  if (error) {
    $("loginMsg").textContent = error.message;
    return;
  }

  $("loginScreen").style.display = "none";
  $("app").style.display = "block";
  $("userBadge").textContent = data.user.email;

  loadHist();
};

/* =========================
   LOGOUT
========================= */
$("btnLogout").onclick = async () => {
  await supabase.auth.signOut();
  location.reload();
};

/* =========================
   ENREGISTRER PESEE
========================= */
$("btnSave").onclick = async () => {
  const net = calc();

  const { error } = await supabase
    .from("pesees")
    .insert({
      ville: $("ville").value,
      type: $("type").value,
      nb: $("nb").value,
      brut: $("brut").value,
      tare: TARE[$("type").value] * $("nb").value,
      net: net
    });

  if (error) {
    $("status").textContent = error.message;
  } else {
    $("status").textContent = "✔ Pesée enregistrée";
    $("brut").value = "";
    calc();
    loadHist();
  }
};

/* =========================
   HISTORIQUE
========================= */
async function loadHist() {
  const { data, error } = await supabase
    .from("pesees")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    $("status").textContent = error.message;
    return;
  }

  $("hist").innerHTML = "";

  data.forEach(r => {
    $("hist").innerHTML += `
      <tr>
        <td>${new Date(r.created_at).toLocaleString()}</td>
        <td>${r.ville}</td>
        <td>${r.type}</td>
        <td class="right">${r.nb}</td>
        <td class="right">${r.net}</td>
      </tr>
    `;
  });
}

/* =========================
   NAVIGATION
========================= */
$("btnShowPesee").onclick = () => {
  $("pagePesee").style.display = "block";
  $("pageHist").style.display = "none";
};

$("btnShowHist").onclick = () => {
  $("pagePesee").style.display = "none";
  $("pageHist").style.display = "block";
  loadHist();
};
</script>

</body>
</html>
