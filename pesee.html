<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesée</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="wrap">
  <div class="card">

    <!-- ================= PAGE PESÉE ================= -->
    <div id="pagePesee">

      <!-- Bouton UNIQUEMENT pour aller à l'historique -->
      <div style="margin-bottom:16px">
        <button onclick="showHistorique()">HISTORIQUE</button>
      </div>

      <h1>Pesée</h1>
      <div id="status">Prêt.</div>

      <div class="grid">
        <div class="col-4">
          <label>Ville</label>
          <select id="ville">
            <option>Assat</option>
            <option>Toulouse</option>
            <option>Pau</option>
          </select>
        </div>

        <div class="col-4">
          <label>Type</label>
          <select id="type">
            <option value="PAM">PAM</option>
            <option value="ECRAN">Écran</option>
            <option value="ASL">ASL</option>
            <option value="ABJ">ABJ</option>
            <option value="F">Frigo</option>
            <option value="HF">Hors froid</option>
          </select>
        </div>

        <div class="col-2">
          <label>Nb bacs (1 à 4)</label>
          <input id="nb" type="number" min="1" max="4" step="1" value="1" inputmode="numeric">
        </div>

        <div class="col-2">
          <label>Poids brut (kg)</label>
          <input id="brut" type="number" step="0.1" inputmode="decimal">
        </div>

        <div class="col-12">
          <div class="big">
            Net : <span id="net">0</span> kg
          </div>
        </div>

        <div class="col-12">
          <button onclick="enregistrer()">ENREGISTRER</button>
        </div>
      </div>
    </div>

    <!-- ================= PAGE HISTORIQUE ================= -->
    <div id="pageHistorique" style="display:none">

      <!-- Bouton RETOUR UNIQUEMENT -->
      <div style="margin-bottom:16px">
        <button onclick="showPesee()">⬅ RETOUR PESÉE</button>
      </div>

      <h1>Historique</h1>

      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Ville</th>
              <th>Type</th>
              <th class="right">Nb</th>
              <th class="right">Net</th>
            </tr>
          </thead>
          <tbody id="historique"></tbody>
        </table>
      </div>

    </div>

  </div>
</div>

<!-- ===== LOGIQUE PESÉE ===== -->
<script>
const TARE = {
  PAM: 59,
  ECRAN: 59,
  ASL: 45,
  ABJ: 43,
  F: 0,
  HF: 0
};

function showPesee(){
  document.getElementById("pagePesee").style.display = "block";
  document.getElementById("pageHistorique").style.display = "none";
}

function showHistorique(){
  document.getElementById("pagePesee").style.display = "none";
  document.getElementById("pageHistorique").style.display = "block";
  afficherHistorique();
}

function normalizeNb() {
  let nb = parseInt(document.getElementById("nb").value || 1);
  if (nb < 1) nb = 1;
  if (nb > 4) nb = 4;
  document.getElementById("nb").value = nb;
  return nb;
}

function calc() {
  const type = document.getElementById("type").value;
  const nb = normalizeNb();
  const brut = Number(document.getElementById("brut").value || 0);
  const tare = (TARE[type] || 0) * nb;
  const net = Math.max(0, brut - tare);
  document.getElementById("net").textContent = net.toFixed(1);
}

["type", "nb", "brut"].forEach(id => {
  document.getElementById(id).addEventListener("input", calc);
});

function enregistrer() {
  calc();

  const brut = Number(document.getElementById("brut").value);
  if (!brut || brut <= 0) {
    alert("Entre un poids brut valide");
    return;
  }

  ajouterHistorique({
    date: Date.now(),
    ville: document.getElementById("ville").value,
    type: document.getElementById("type").value,
    nb: normalizeNb(),
    net: Number(document.getElementById("net").textContent)
  });

  document.getElementById("brut").value = "";
  calc();
}
</script>

<!-- ===== HISTORIQUE (séparé) ===== -->
<script src="historique.js"></script>

</body>
</html>
