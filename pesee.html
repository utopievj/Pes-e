<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesée</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">
  <h2>Pesée</h2>

  <label>Ville</label>
  <input id="ville" type="text" placeholder="Ex: Toulouse">

  <label>Type</label>
  <select id="type">
    <option value="PAM">PAM (59 kg)</option>
    <option value="ECRAN">Écran (59 kg)</option>
    <option value="ASL">ASL (45 kg)</option>
    <option value="ABJ">ABJ (43 kg)</option>
  </select>

  <label>Nombre de bacs (1 à 4)</label>
  <select id="nb">
    <option>1</option>
    <option>2</option>
    <option>3</option>
    <option>4</option>
  </select>

  <label>Poids brut (kg)</label>
  <input id="brut" type="number" step="0.1">

  <h3>Net : <span id="net">0</span> kg</h3>

  <button onclick="enregistrer()">ENREGISTRER</button>

  <button class="secondary" onclick="location.href='historique.html'">
    Voir l’historique
  </button>

  <div id="msg"></div>
</div>

<script>
const TARES = { PAM:59, ECRAN:59, ASL:45, ABJ:43 };
const $ = id => document.getElementById(id);

function calcul(){
  const type = $("type").value;
  const nb = Number($("nb").value);
  const brut = Number($("brut").value || 0);
  const net = Math.max(0, brut - TARES[type] * nb);
  $("net").textContent = net.toFixed(1);
}

["type","nb","brut"].forEach(id=>{
  $(id).addEventListener("input", calcul);
});

function enregistrer(){
  const ville = $("ville").value.trim();
  const brut = Number($("brut").value);

  if(!ville || brut <= 0){
    $("msg").textContent = "❌ Données invalides";
    return;
  }

  const type = $("type").value;
  const nb = Number($("nb").value);
  const net = brut - TARES[type] * nb;

  const ligne = {
    date: new Date().toLocaleString(),
    ville, type, nb, brut,
    net: net.toFixed(1)
  };

  const hist = JSON.parse(localStorage.getItem("historique") || "[]");
  hist.unshift(ligne);
  localStorage.setItem("historique", JSON.stringify(hist));

  $("msg").textContent = "✅ Enregistré";
  $("brut").value = "";
  calcul();
}
</script>

</body>
</html>
