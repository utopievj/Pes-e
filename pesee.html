<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Pesée</title>

  <!-- Optionnel -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#b22222">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{margin:0;font-family:system-ui;background:#0b0c10;color:#e9eef6}
    .wrap{max-width:980px;margin:auto;padding:16px}
    .card{background:#12141b;border:1px solid #222634;border-radius:16px;padding:16px}
    label{display:block;margin:8px 0 4px;font-size:12px;color:#fff}
    input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #262b3a;background:#0f1118;color:#fff;box-sizing:border-box}
    button{padding:14px;border-radius:12px;border:1px solid #7a1f1f;background:#b22222;color:#fff;font-weight:800;cursor:pointer}
    button:hover{background:#d32f2f}
    .smallBtn{padding:10px 12px;font-size:12px}
    .danger{background:#8b0000;border-color:#5c0000}
    .grid{display:grid;gap:12px;grid-template-columns:repeat(12,1fr)}
    .col-4{grid-column:span 4}.col-2{grid-column:span 2}.col-12{grid-column:span 12}
    @media(max-width:820px){.col-4,.col-2{grid-column:span 12}}
    .big{font-size:34px;font-weight:900;margin:8px 0}
    .badge{display:inline-block;padding:4px 10px;border:1px solid #222634;border-radius:999px;font-size:12px;color:#fff}
    .tableWrap{overflow:auto;border:1px solid #222634;border-radius:12px;margin-top:10px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px;border-bottom:1px solid #222634}
    th{font-size:12px;color:#fff;white-space:nowrap;text-align:left}
    .right{text-align:right}
    .center{min-height:90vh;display:flex;align-items:center;justify-content:center}
    .max420{max-width:420px;width:100%}
    #status,#loginMsg{margin-top:10px;font-size:12px;white-space:pre-wrap;color:#ffd27a}
    hr{border:0;border-top:1px solid #222634;margin:14px 0}
    .ok{color:#a7f3c6}
    .ko{color:#ffd27a}
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="center">
  <div class="card max420">
    <h2 style="margin-top:0">Connexion</h2>

    <div id="bootChecks" style="margin-bottom:8px;font-size:12px;line-height:1.5"></div>

    <label>Email</label>
    <input id="email" type="email" autocomplete="username">

    <label>Mot de passe</label>
    <input id="password" type="password" autocomplete="current-password">

    <div style="margin-top:12px;display:grid;gap:10px">
      <button id="btnLogin" type="button">SE CONNECTER</button>
      <button class="danger" id="btnReset" type="button">RESET CACHE</button>
    </div>

    <div id="loginMsg"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="wrap">
    <div class="card">

      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="smallBtn" type="button" onclick="show('pesee')">PESÉE</button>
        <button class="smallBtn" type="button" onclick="show('hist')">HISTORIQUE</button>
        <button class="smallBtn" type="button" onclick="show('trie')">TRIE</button>
        <button class="smallBtn" type="button" onclick="loadAll()">🔄 Rafraîchir</button>
        <button class="smallBtn" type="button" onclick="logout()">🚪 Déconnexion</button>
        <span class="badge" id="badgeUser">Connecté</span>
        <span class="badge" id="badgeNet">Réseau : ?</span>
        <span class="badge" id="badgeAdmin">Utilisateur</span>
      </div>

      <div id="status">Prêt.</div>

      <!-- PAGE PESÉE -->
      <div id="pagePesee">
        <h2>Pesée</h2>

        <div class="grid">
          <div class="col-4">
            <label>Ville</label>
            <select id="ville"></select>
          </div>

          <div class="col-4">
            <label>Type</label>
            <select id="type">
              <option value="PAM">PAM</option>
              <option value="ASL">ASL</option>
              <option value="ABJ">ABJ</option>
              <option value="FRIGO">FRIGO</option>
              <option value="HF">HF</option>
            </select>
          </div>

          <div class="col-2">
            <label>Nb bacs</label>
            <input id="nb" type="number" inputmode="numeric" min="1" step="1" value="1">
          </div>

          <div class="col-2">
            <label>Brut (kg)</label>
            <input id="brut" type="number" inputmode="decimal" step="0.1" placeholder="Ex: 120.5">
          </div>

          <div class="col-12">
            <div class="big">Net : <span id="net">0</span> kg</div>
            <div style="font-size:12px;color:#fff">Tares : PAM 59, ASL 45, ABJ 43, FRIGO 0, HF 0</div>
          </div>

          <div class="col-12">
            <button type="button" onclick="savePesee()">ENREGISTRER</button>
          </div>
        </div>
      </div>

      <!-- PAGE HIST -->
      <div id="pageHist" style="display:none">
        <h2>Historique</h2>

        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>Date</th><th>Ville</th><th>Type</th><th class="right">Nb</th><th class="right">Net</th><th>Opérateur</th>
              </tr>
            </thead>
            <tbody id="histTable"></tbody>
          </table>
        </div>
      </div>

      <!-- PAGE TRIE -->
      <div id="pageTrie" style="display:none">
        <h2>Tri</h2>

        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
          <button type="button" onclick="addTrie('PAM_TRIE', +1)">+1 PAM</button>
          <button class="danger" type="button" onclick="addTrie('PAM_TRIE', -1)">-1 PAM</button>

          <button type="button" onclick="addTrie('ASL_TRIE', +1)">+1 ASL</button>
          <button class="danger" type="button" onclick="addTrie('ASL_TRIE', -1)">-1 ASL</button>

          <button type="button" onclick="addTrie('ABJ_TRIE', +1)">+1 ABJ</button>
          <button class="danger" type="button" onclick="addTrie('ABJ_TRIE', -1)">-1 ABJ</button>

          <button type="button" onclick="addTrie('FRIGO_TRIE', +1)">+1 FRIGO</button>
          <button class="danger" type="button" onclick="addTrie('FRIGO_TRIE', -1)">-1 FRIGO</button>

          <button type="button" onclick="addTrie('HF_TRIE', +1)">+1 HF</button>
          <button class="danger" type="button" onclick="addTrie('HF_TRIE', -1)">-1 HF</button>

          <button class="smallBtn" type="button" onclick="loadTrie()">🔄 Rafraîchir</button>
        </div>

        <div id="trieBlocks"></div>
      </div>

    </div>
  </div>
</div>

<script>
/* =========================
   CONFIG
========================= */
const SUPABASE_URL = "https://dzfokswsmkvhjhziqakj.supabase.co";
const SUPABASE_ANON_KEY = "REMPLACE_PAR_TA_CLE_ANON";

const $ = (id)=>document.getElementById(id);
const r1 = (x)=>Math.round(x*10)/10;
const num = (x)=>{ const v=Number(String(x).replace(",", ".")); return Number.isFinite(v)?v:0; };

function setStatus(msg){ $("status").textContent = msg || ""; }
function setLoginMsg(msg){ $("loginMsg").textContent = msg || ""; }
function refreshNetwork(){ $("badgeNet").textContent = "Réseau : " + (navigator.onLine ? "OK" : "HORS-LIGNE"); }
window.addEventListener("online", refreshNetwork);
window.addEventListener("offline", refreshNetwork);

function bootLine(ok, text){ return `<div class="${ok?'ok':'ko'}">${ok?'✅':'❌'} ${text}</div>`; }

let supabase = null;
let currentUser = null;
let isAdminUser = false;

document.addEventListener("DOMContentLoaded", async ()=>{
  $("btnLogin").addEventListener("click", login);
  $("btnReset").addEventListener("click", resetCache);

  const checks = [];
  checks.push(bootLine(true, "JS OK"));

  if(!window.supabase){
    checks.push(bootLine(false, "Supabase SDK NON chargé (CDN bloqué)"));
    $("bootChecks").innerHTML = checks.join("");
    setLoginMsg("❌ Le SDK Supabase ne se charge pas. Change de réseau / désactive AdBlock/antivirus.");
    return;
  }
  checks.push(bootLine(true, "Supabase SDK chargé"));
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Test health (explique DNS/fetch)
  try{
    const ctrl = new AbortController();
    setTimeout(()=>ctrl.abort(), 7000);
    const res = await fetch(SUPABASE_URL + "/auth/v1/health", { signal: ctrl.signal, cache:"no-store" });
    checks.push(bootLine(res.ok, "Supabase joignable (health)"));
    if(!res.ok) setLoginMsg("❌ Supabase répond mais erreur HTTP: "+res.status);
  }catch(e){
    checks.push(bootLine(false, "Supabase INJOIGNABLE (DNS/Fetch)"));
    setLoginMsg("❌ Impossible de contacter Supabase.\nErreur: " + (e?.message||String(e)) +
      "\n\nTeste ce lien dans Chrome:\n" + SUPABASE_URL + "/auth/v1/health");
  }
  $("bootChecks").innerHTML = checks.join("");

  refreshNetwork();
  calc();

  const { data } = await supabase.auth.getUser();
  if(data?.user) afterLogin(data.user);
});

/* NAV */
function show(p){
  $("pagePesee").style.display = (p==="pesee") ? "block" : "none";
  $("pageHist").style.display  = (p==="hist")  ? "block" : "none";
  $("pageTrie").style.display  = (p==="trie")  ? "block" : "none";
  if(p==="hist") loadHist();
  if(p==="trie") loadTrie();
}

/* ADMIN */
async function refreshAdmin(){
  try{
    const { data, error } = await supabase.rpc("is_admin");
    if(error) throw error;
    isAdminUser = !!data;
  }catch{ isAdminUser = false; }
  $("badgeAdmin").textContent = isAdminUser ? "ADMIN" : "Utilisateur";
}

/* AUTH */
async function login(){
  try{
    const email = $("email").value.trim();
    const password = $("password").value;
    if(!email || !password) return setLoginMsg("Email + mot de passe obligatoires.");
    setLoginMsg("Connexion…");

    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if(error) throw error;

    const { data } = await supabase.auth.getUser();
    if(!data?.user) throw new Error("Connexion OK mais user null");
    afterLogin(data.user);
  }catch(e){
    setLoginMsg("❌ " + (e?.message || String(e)));
  }
}

async function afterLogin(user){
  currentUser = user;
  $("badgeUser").textContent = "Connecté : " + (user.email || "—");
  $("loginScreen").style.display = "none";
  $("app").style.display = "block";
  setLoginMsg("");
  setStatus("✅ Connecté");
  await refreshAdmin();
  await loadAll();
  show("pesee");
}

async function logout(){
  try{ await supabase.auth.signOut(); location.reload(); }
  catch(e){ setStatus("❌ " + (e?.message || String(e))); }
}

function resetCache(){
  try{ localStorage.clear(); setLoginMsg("✅ Cache local supprimé. Recharge la page."); }
  catch(e){ setLoginMsg("❌ " + (e?.message || String(e))); }
}

/* PESEE */
const T = { PAM:59, ASL:45, ABJ:43, FRIGO:0, HF:0 };
function calc(){
  const nb = Math.max(1, Math.floor(num($("nb").value || 1)));
  $("nb").value = String(nb);
  const brut = num($("brut").value);
  const tare = (T[$("type").value] || 0) * nb;
  const net = Math.max(0, brut - tare);
  $("net").textContent = r1(net);
}
["input","change"].forEach(ev=>{
  $("type").addEventListener(ev, calc);
  $("nb").addEventListener(ev, calc);
  $("brut").addEventListener(ev, calc);
});

async function loadCities(){
  try{
    const { data, error } = await supabase.from("villes").select("nom").order("nom",{ascending:true});
    if(error) throw error;
    const sel = $("ville");
    sel.innerHTML = "";
    (data||[]).forEach(v=>{
      const opt=document.createElement("option");
      opt.value=v.nom; opt.textContent=v.nom;
      sel.appendChild(opt);
    });
    if(!sel.options.length){
      const opt=document.createElement("option");
      opt.value=""; opt.textContent="(Aucune ville)";
      sel.appendChild(opt);
    }
  }catch(e){
    setStatus("❌ VILLES: " + (e?.message || String(e)));
  }
}

async function savePesee(){
  try{
    calc();
    const ville = ($("ville").value||"").trim();
    const type = $("type").value;
    const nb = Math.max(1, Math.floor(num($("nb").value || 1)));
    const brut = num($("brut").value);
    const tare = (T[type]||0)*nb;
    const net = Math.max(0, brut - tare);

    if(!ville) return alert("Choisis une ville.");
    if(brut<=0) return alert("Entre un brut.");
    if(brut<tare) return alert("Brut < tare.");

    const client_id = "p_" + Date.now() + "_" + Math.random().toString(16).slice(2);
    const operator = currentUser?.email || null;

    const { error } = await supabase.from("pesees").insert({
      client_id, ville, type, nb, brut:r1(brut), tare:r1(tare), net:r1(net), operator
    });
    if(error) throw error;

    $("brut").value="";
    calc();
    setStatus("✅ Enregistré");
    await loadHist();
  }catch(e){
    setStatus("❌ PESEE: " + (e?.message || String(e)));
  }
}

/* HIST */
async function loadHist(){
  try{
    const { data, error } = await supabase
      .from("pesees")
      .select("created_at, ville, type, nb, net, operator")
      .order("created_at",{ascending:false})
      .limit(1200);
    if(error) throw error;

    const tb=$("histTable");
    tb.innerHTML="";
    if(!(data||[]).length){
      tb.innerHTML=`<tr><td colspan="6">Aucune donnée</td></tr>`;
      return;
    }
    tb.innerHTML = data.map(r=>`
      <tr>
        <td>${new Date(r.created_at).toLocaleString()}</td>
        <td>${r.ville}</td>
        <td>${r.type}</td>
        <td class="right">${r.nb}</td>
        <td class="right"><b>${r.net}</b></td>
        <td>${r.operator||"—"}</td>
      </tr>
    `).join("");
  }catch(e){
    setStatus("❌ HIST: " + (e?.message || String(e)));
  }
}

/* TRIE */
const TRIE_KINDS = [
  { key:"PAM_TRIE",   label:"PAM trié" },
  { key:"ASL_TRIE",   label:"ASL trié" },
  { key:"ABJ_TRIE",   label:"ABJ trié" },
  { key:"FRIGO_TRIE", label:"FRIGO trié" },
  { key:"HF_TRIE",    label:"HF trié" }
];

function ymdLocal(iso){
  const d=new Date(iso);
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const da=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${da}`;
}

async function addTrie(kind, delta){
  try{
    const client_id = "t_" + kind + "_" + Date.now() + "_" + Math.random().toString(16).slice(2);
    const user_email = currentUser?.email || null;
    const { error } = await supabase.from("trie_events").insert({ client_id, kind, delta, user_email });
    if(error) throw error;
    setStatus("✅ TRI ajouté: "+kind+" ("+(delta>0?"+":"")+delta+")");
    await loadTrie();
  }catch(e){
    setStatus("❌ TRIE: " + (e?.message || String(e)));
  }
}

async function loadTrie(){
  try{
    const { data, error } = await supabase
      .from("trie_events")
      .select("created_at, kind, delta, user_email")
      .order("created_at",{ascending:false})
      .limit(4000);
    if(error) throw error;

    const byKind = {};
    for(const k of TRIE_KINDS) byKind[k.key]=[];
    for(const row of (data||[])){
      if(!byKind[row.kind]) byKind[row.kind]=[];
      byKind[row.kind].push(row);
    }

    $("trieBlocks").innerHTML = TRIE_KINDS.map(k=>{
      const rows = byKind[k.key] || [];
      const totals = {};
      for(const r of rows){
        const day = ymdLocal(r.created_at);
        totals[day] = (totals[day]||0) + (Number(r.delta)||0);
      }
      const totalsArr = Object.keys(totals).sort((a,b)=>b.localeCompare(a)).map(day=>({day,total:totals[day]}));

      const totalsHtml = totalsArr.length
        ? totalsArr.map(t=>`<tr><td>${t.day}</td><td class="right"><b>${t.total}</b></td></tr>`).join("")
        : `<tr><td colspan="2">Aucune donnée</td></tr>`;

      const histHtml = rows.length
        ? rows.slice(0,400).map(r=>{
            const dt = new Date(r.created_at).toLocaleString();
            const v = (r.delta>0?("+"+r.delta):String(r.delta));
            return `<tr><td>${dt}</td><td class="right"><b>${v}</b></td><td>${r.user_email||"—"}</td></tr>`;
          }).join("")
        : `<tr><td colspan="3">Aucune donnée</td></tr>`;

      return `
        <div style="margin-bottom:18px">
          <h3>${k.label}</h3>

          <h4>Total par jour</h4>
          <div class="tableWrap">
            <table>
              <thead><tr><th>Jour</th><th class="right">Total</th></tr></thead>
              <tbody>${totalsHtml}</tbody>
            </table>
          </div>

          <h4 style="margin-top:14px">Détails (date + heure)</h4>
          <div class="tableWrap">
            <table>
              <thead><tr><th>Date/Heure</th><th class="right">+ / -</th><th>Utilisateur</th></tr></thead>
              <tbody>${histHtml}</tbody>
            </table>
          </div>
        </div>
      `;
    }).join("");

    setStatus("Prêt.");
  }catch(e){
    setStatus("❌ TRIE LOAD: " + (e?.message || String(e)));
  }
}

/* LOAD ALL */
async function loadAll(){
  await loadCities();
  await loadHist();
  await loadTrie();
}
</script>

</body>
</html>
